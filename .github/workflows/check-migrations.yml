name: check-migrations

# Blocks merging if any local migration in supabase/migrations/ has not been
# applied to the linked production Supabase project. See
# scripts/check-pending-migrations.mjs for the actual check logic.
#
# Required GitHub secret:
#   SUPABASE_ACCESS_TOKEN — personal access token from
#                           https://supabase.com/dashboard/account/tokens

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: check-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify all migrations applied to prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: https://avwgiqkhkrdixwcopvod.supabase.co
          CHECK_PENDING_MIGRATIONS: '1'
        run: node scripts/check-pending-migrations.mjs
